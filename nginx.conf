server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/pndapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pndapp.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Telegram webhook proxy
    location /webhook {
        proxy_pass http://localhost:80/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_connect_timeout 10s;
    }

    # OAuth callback proxy (placeholder for future)
    # location /oauth/callback {
    #     proxy_pass http://bot:80/oauth/callback;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Health check endpoint
    location /health {
        proxy_pass http://localhost:8046/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Block other access
    location / {
        return 404;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
