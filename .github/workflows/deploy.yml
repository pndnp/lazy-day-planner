name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Setup GitHub SSH Keys (for git pull)
        run: |
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'
            set -e

            PROJECT_DIR="/home/deploy/lazy-day-planner"

            # Clone repo if doesn't exist
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              git clone https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/pndnp/lazy-day-planner.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"

            # Pull latest changes
            git config --global --add safe.directory "$PROJECT_DIR"
            git pull origin main

            # Pull and rebuild Docker images
            docker compose pull || true
            docker compose up -d --build

            # Cleanup unused images
            docker image prune -f

            # Check if container is running
            docker compose ps
          EOF
